# Testfragen für die Evaluation (SW9, Vorbereitung). 5 pro Kategorie.
# Felder:
#   in_scope      erwartete Zuständigkeit (classify)
#   kategorie     erwartete Kategorie (classify), bei nicht zuständig egal
#   tools         mindestens eines dieser Tools muss aufgerufen werden ([] = keines)
#   stichwoerter  Liste von Gruppen; aus JEDER Gruppe muss mindestens ein Wort in der Antwort vorkommen
#                 (Kleinschreibung, Teilstring)
#   quelle        Teilstring, der in mindestens einer Quelle vorkommen muss (optional)
# Stand der Fakten: 09.11.2026, Daten aus data/termine und data/knowledge.

