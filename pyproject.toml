[project]
name = "study-survivor"
version = "0.1.0"
description = "Study Agent als LangGraph-Agent (GenAI & Agentensysteme, FHNW)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langchain==1.4.9",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-mcp-adapters==0.3.2",
    "mcp==1.30.0",
    "langchain-chroma==1.1.0",
    "langsmith>=0.14",
    "python-dotenv>=1.1",
    "markitdown[pdf,pptx,docx,xlsx]>=0.1.8,<0.2",
    "pdfplumber>=0.11",
    "pillow>=11",
    "pypdfium2==5.14.0",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "langchain-text-splitters==1.1.3",
]

[project.scripts]
study = "study_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["study_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
